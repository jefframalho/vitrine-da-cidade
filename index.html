<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vitrine da Cidade</title>
<meta name="description" content="Encontre as lojas da sua cidade pelo CEP: WhatsApp, Instagram, produtos e catálogo online.">
<meta name="theme-color" content="#0E6E66">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="css/estilo.css?v=6">
</head>
<body>

<header class="topo">
  <div class="wrap" id="topo"></div>
</header>

<div class="fixa" id="fixa" hidden>
  <div class="wrap">
    <div class="busca">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Buscar loja, produto ou categoria" aria-label="Buscar lojas">
    </div>
    <nav class="cats" id="cats" aria-label="Categorias"></nav>
  </div>
</div>

<main class="wrap">
  <div class="barra"><span class="conta" id="conta">Carregando lojas…</span></div>
  <div id="aviso" class="aviso" hidden></div>
  <section id="conteudo" aria-live="polite"></section>
</main>

<section class="anuncie">
  <div class="wrap"><div class="caixa">
    <div>
      <h2>Sua loja aqui</h2>
      <p>Coloque sua loja no guia com produtos, preços e catálogo. Tem plano grátis e planos com destaque.</p>
    </div>
    <div class="contato" style="gap:8px">
      <span class="mono sel" id="contato-num"></span>
      <a class="btn" href="planos.html">Ver planos</a>
      <a class="btn btn-brand" id="contato-link" target="_blank" rel="noopener" href="#">Chamar no WhatsApp</a>
    </div>
  </div></div>
</section>
<p class="rodape wrap">Busca de CEP por <a href="https://viacep.com.br" target="_blank" rel="noopener">ViaCEP</a> e <a href="https://brasilapi.com.br" target="_blank" rel="noopener">BrasilAPI</a>.</p>

<div id="overlay" class="fundo" hidden></div>
<div id="toast" class="toast" hidden></div>

<script>
(function(){
  function mostrar(t){var a=document.getElementById('aviso');if(a){a.hidden=false;a.textContent=t;}var c=document.getElementById('carregando');if(c)c.hidden=true;}
  if(location.protocol==='file:'){mostrar('Abra pelo endereço do site (https://jefframalho.github.io/vitrine-da-cidade/). Aberto direto do arquivo no computador, ele não funciona.');return;}
  window.addEventListener('error',function(e){if(window.__ok)return;var t=e.target;var arq=(t&&t.src)||e.filename||'';mostrar('Erro ao carregar: '+(e.message||'um arquivo não carregou')+(arq?' ('+arq.split('/').pop()+')':'')+'. Mande uma captura desta tela.');},true);
  window.addEventListener('unhandledrejection',function(e){var r=e.reason||{};mostrar('Erro: '+(r.code||r.message||r)+'. Mande uma captura desta tela.');});
  setTimeout(function(){if(!window.__ok)mostrar('A página não iniciou. Recarregue (no computador, Ctrl+Shift+R). Se continuar, mande uma captura desta tela e diga qual navegador está usando.');},9000);
})();
</script>
<script type="module" src="js/app.js?v=6"></script>
</body>
</html>
